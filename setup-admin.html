<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin Setup</title>
</head>

<body style="font-family:Arial;padding:40px">

  <h2>Admin Setup</h2>

  <p>Enter your setup secret:</p>

  <input
    id="secret"
    type="password"
    placeholder="ADMIN_SETUP_SECRET"
    style="padding:10px;width:300px"
  >

  <button
    id="run"
    style="padding:10px 20px;margin-left:10px"
  >
    Assign Admin
  </button>

  <pre id="result" style="margin-top:20px"></pre>

  <script>
    document.getElementById('run').onclick = async () => {

      const secret = document.getElementById('secret').value;
      const result = document.getElementById('result');

      if (!secret) {
        result.textContent = 'Please enter the setup secret.';
        return;
      }

      result.textContent = 'Assigning admin role...';

      try {
        const response = await fetch('/.netlify/functions/make-admin', {
          method: 'POST',
          headers: {
            'x-setup-secret': secret
          }
        });

        const data = await response.json();

        if (!response.ok) {
          result.textContent =
            'Error: ' + (data.error || 'Request failed');
          return;
        }

        result.textContent =
          data.message || 'Admin role assigned successfully.';

      } catch (error) {
        result.textContent =
          'Error: ' + (error.message || 'Something went wrong.');
      }
    };
  </script>

</body>
</html>
