<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ANUNEEL Admin Login</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#eef4ef;font-family:Arial,sans-serif;color:#163d2e}.box{width:min(420px,90vw);background:#fff;border-radius:22px;padding:34px;box-shadow:0 20px 60px #16473422}.brand{letter-spacing:3px;font-size:12px;color:#a77e20;font-weight:700}.box h1{font-family:Georgia,serif;font-size:34px;margin:10px 0 8px}.box p{color:#6d7c74;font-size:14px}.row{display:grid;gap:10px;margin:18px 0}.row input{padding:13px;border:1px solid #d9e0db;border-radius:10px}.btn{width:100%;padding:13px;border:0;border-radius:10px;background:#164734;color:#fff;font-weight:700;cursor:pointer}.msg{margin-top:14px;font-size:13px}.back{display:block;text-align:center;margin-top:16px;color:#164734;text-decoration:none;font-size:13px}</style></head><body><div class="box"><div class="brand">ANUNEEL SAREE'Z • ADMIN</div><h1>Admin Login</h1><p>Only authorised admin users can manage sarees, images, names, ALT text and prices.</p><div class="row"><input id="email" type="email" placeholder="Admin email"><input id="password" type="password" placeholder="Password"><button class="btn" id="login">Login</button></div><div class="msg" id="msg"></div><a class="back" href="/">← Back to website</a></div><script type="module">import{login,handleAuthCallback}from'https://esm.sh/@netlify/identity@latest';const m=document.getElementById('msg');try{await handleAuthCallback()}catch(e){m.textContent=e.message||'Authentication callback failed.'}document.getElementById('login').onclick=async()=>{m.textContent='Signing in…';try{await login(document.getElementById('email').value.trim(),document.getElementById('password').value);location.href='/admin/'}catch(e){m.textContent=e.message||'Login failed.'}}</script></body></html>
