<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ANUNEEL SAREE'Z • Admin</title><style>:root{--g:#164734;--gold:#c69727;--bg:#eef4ef;--muted:#718079}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#183b2f;font-family:Arial,sans-serif}.top{background:linear-gradient(90deg,#164734,#c69727,#7b4c67);color:#fff;padding:10px 24px;text-align:center;font-size:11px;letter-spacing:2px}.wrap{max-width:1200px;margin:28px auto;padding:0 20px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.head h1{font:42px Georgia,serif;margin:0}.head p{color:var(--muted)}button{border:0;border-radius:10px;padding:10px 13px;cursor:pointer;font-weight:700}.logout{background:#fff;color:var(--g);border:1px solid #d5dfd8}.grid{display:grid;grid-template-columns:350px 1fr;gap:20px}.panel{background:#fff;border:1px solid #dfe7e1;border-radius:18px;padding:20px;box-shadow:0 10px 30px #1647340b}.panel h2{font:26px Georgia,serif;margin:0 0 14px}.field{display:grid;gap:7px;margin:12px 0}.field label{font-size:11px;color:#7b867f;text-transform:uppercase;letter-spacing:1px}.field input{padding:12px;border:1px solid #d7e0da;border-radius:9px;width:100%}.primary{background:var(--g);color:#fff;width:100%}.hint{font-size:11px;color:var(--muted);line-height:1.5}.list{display:grid;gap:12px}.item{display:grid;grid-template-columns:78px 1fr auto;gap:14px;align-items:center;border:1px solid #e1e8e3;border-radius:14px;padding:10px}.item img{width:78px;height:98px;object-fit:cover;border-radius:9px;background:#eee}.item strong{font-size:15px}.item small{display:block;color:var(--muted);margin:4px 0}.actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.edit{background:#eaf2ed;color:var(--g)}.danger{background:#fff0f0;color:#a63b3b}.gold{background:#fff7df;color:#916b14}.blue{background:#eef3ff;color:#385b9c}.status{margin:8px 0;font-size:12px;min-height:18px}@media(max-width:850px){.grid{grid-template-columns:1fr}.head{align-items:flex-start;flex-direction:column}.item{grid-template-columns:65px 1fr}.item img{width:65px;height:82px}.actions{grid-column:1/-1;justify-content:flex-start}}</style></head><body><div class="top">ANUNEEL SAREE'Z • SECURE ADMIN</div><div class="wrap"><div class="head"><div><h1>Manage Collection</h1><p>Only authorised admin users can change website content.</p></div><button class="logout" id="logout">Logout</button></div><div class="grid"><section class="panel"><h2>Add Saree</h2><div class="field"><label>Photo</label><input id="file" type="file" accept="image/*"></div><div class="field"><label>Name</label><input id="title" placeholder="e.g. Emerald Silk Wine & Gold"></div><div class="field"><label>ALT Name</label><input id="alt" placeholder="Accessible image description"></div><div class="field"><label>Collection</label><input id="category" value="New Arrival"></div><div class="field"><label>Price (₹)</label><input id="price" type="number" min="0" step="1" placeholder="1950"></div><button class="primary" id="add">Add to Website</button><div class="status" id="status"></div><p class="hint">Changes are saved server-side with Netlify Blobs, so your updates are shared across devices.</p></section><section class="panel"><h2>Current Collection <span id="count" style="float:right;font:12px Arial;color:#718079"></span></h2><div class="list" id="list"></div></section></div></div><script type="module">import{getUser,logout}from'https://esm.sh/@netlify/identity@latest';const $=id=>document.getElementById(id),status=$('status');let items=[];function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}async function api(url,opt={}){const r=await fetch(url,{...opt,headers:{...(opt.body instanceof FormData?{}:{'content-type':'application/json'}),...(opt.headers||{})}});if(!r.ok)throw new Error(await r.text()||r.statusText);return r.status===204?null:r.json()}async function check(){const u=await getUser();if(!u||!(u.roles||[]).includes('admin')){location.href='/login.html';return false}return true}async function load(){items=await api('/api/catalog');render()}function preview(item){return item.imageKey?'/api/image?key='+encodeURIComponent(item.imageKey):''}function render(){$('count').textContent=items.length+' items';const list=$('list');list.innerHTML='';items.forEach(item=>{const row=document.createElement('div');row.className='item';row.innerHTML='<div><img alt=""></div><div><strong></strong><small></small><small></small></div><div class="actions"><button class="edit editBtn">Edit</button><button class="gold priceBtn">Price</button><button class="blue imageBtn">Replace</button><button class="danger hideBtn">'+(item.hidden?'Show':'Hide')+'</button></div>';const im=row.querySelector('img');im.src=preview(item);im.alt=item.alt;row.querySelector('strong').textContent=item.title;row.querySelectorAll('small')[0].textContent=item.category+' · ₹'+(item.price||'—');row.querySelectorAll('small')[1].textContent='ALT: '+item.alt+(item.hidden?' · HIDDEN':'');row.querySelector('.editBtn').onclick=()=>edit(item);row.querySelector('.priceBtn').onclick=()=>price(item);row.querySelector('.imageBtn').onclick=()=>replace(item);row.querySelector('.hideBtn').onclick=async()=>{await api('/api/catalog',{method:'PUT',body:JSON.stringify({id:item.id,hidden:!item.hidden})});await load()};list.appendChild(row)})}async function edit(item){const title=prompt('Image Name:',item.title);if(title===null)return;const alt=prompt('ALT Name:',item.alt);if(alt===null)return;const category=prompt('Collection:',item.category);if(category===null)return;await api('/api/catalog',{method:'PUT',body:JSON.stringify({id:item.id,title,alt,category})});await load()}async function price(item){const v=prompt('Price (₹):',item.price||'');if(v===null)return;await api('/api/catalog',{method:'PUT',body:JSON.stringify({id:item.id,price:v})});await load()}async function replace(item){const input=document.createElement('input');input.type='file';input.accept='image/*';input.click();await new Promise(r=>input.onchange=r);const f=input.files?.[0];if(!f)return;if(f.size>5*1024*1024){alert('Image must be 5 MB or smaller.');return}const fd=new FormData();fd.append('file',f);const up=await api('/api/image',{method:'POST',body:fd});const old=item.imageKey;await api('/api/catalog',{method:'PUT',body:JSON.stringify({id:item.id,imageKey:up.key})});if(old)await api('/api/image?key='+encodeURIComponent(old),{method:'DELETE'});await load()}async function del(item){if(!confirm('Permanently delete this added saree?'))return;await api('/api/catalog',{method:'DELETE',body:JSON.stringify({id:item.id})});await load()}$('add').onclick=async()=>{try{status.textContent='';const f=$('file').files[0];if(!f)throw new Error('Please choose a saree image.');if(f.size>5*1024*1024)throw new Error('Image must be 5 MB or smaller.');const title=$('title').value.trim();if(!title)throw new Error('Please enter an image name.');const fd=new FormData();fd.append('file',f);const up=await api('/api/image',{method:'POST',body:fd});await api('/api/catalog',{method:'POST',body:JSON.stringify({title,alt:$('alt').value.trim()||title,category:$('category').value.trim()||'New Arrival',price:$('price').value,imageKey:up.key})});$('file').value='';$('title').value='';$('alt').value='';$('price').value='';status.textContent='Added successfully.';await load()}catch(e){status.textContent=e.message||'Something went wrong.'}};$('logout').onclick=async()=>{await logout();location.href='/login.html'};if(await check())await load();</script></body></html>
